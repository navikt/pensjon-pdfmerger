version: "2.4"
services:
  pdfmerger:
    container_name: pdfmerger
    build:
      context: .
      dockerfile_inline: |
        FROM ${PDFMERGER_IMAGE}
        COPY --from=busybox:stable-musl /bin/wget /usr/bin/wget
      pull: false
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "-q", "-O", "/dev/null", "http://localhost:8080/ping"]
      interval: 1s
      timeout: 3s
      retries: 60

  test:
    depends_on:
      pdfmerger:
        condition: service_healthy
    image: postman/newman:alpine
    volumes:
      - ./src/test/resources:/etc/newman:ro
    command: run -e docker-compose.postman_environment.json pdfmerger.postman_collection.json
